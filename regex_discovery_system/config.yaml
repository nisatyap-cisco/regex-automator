model_id: "anthropic.claude-3-5-sonnet-20240620-v1:0"
temperature: 0.2
max_tokens: 4096
dataset_size: 1500
train_ratio: 0.70
batch_size: 200
max_retries: 3
# Rotating proxies for Camoufox stealth browser (overridden by PROXIES in .env)
proxies:
  - "http://user:pass@proxy1.example.com:8080"
  - "http://user:pass@proxy2.example.com:8080"

# ── Secrets are loaded from .env (see .env.example) ──
# AWS_PROFILE, AWS_REGION, TAVILY_API_KEY, PROXIES
# Set them in .env for local dev; on EC2/ECS leave AWS_PROFILE empty
# to use the instance role automatically.
